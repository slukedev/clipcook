<!doctype html>
<html><head><title>Pancakes</title><meta property="og:site_name" content="Flip Daily"></head>
<body>
<div itemscope itemtype="https://schema.org/Recipe">
  <h1 itemprop="name">Fluffy Pancakes</h1>
  <img itemprop="image" src="/photos/pancakes.jpg" alt="">
  <p itemprop="description">Tall, tender &amp; quick.</p>
  <span itemprop="recipeYield">8 pancakes</span>
  <meta itemprop="prepTime" content="PT10M">
  <time itemprop="cookTime" datetime="PT15M">15 min</time>
  <div itemprop="author" itemscope itemtype="https://schema.org/Person"><span itemprop="name">Ada Cook</span></div>
  <ul>
    <li itemprop="recipeIngredient">1 &frac12; cups flour</li>
    <li itemprop="recipeIngredient">2 tbsp sugar</li>
    <li itemprop="recipeIngredient">1 1/4 cups milk</li>
  </ul>
  <div itemprop="recipeInstructions">
    <ol><li>Whisk the dry ingredients.</li><li>Add milk and stir until just combined.</li><li>Cook on a hot griddle, 2 minutes per side.</li></ol>
  </div>
  <meta itemprop="recipeCategory" content="Breakfast">
</div>
</body></html>
