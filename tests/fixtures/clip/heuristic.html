<h1>Grandma's Chicken Soup</h1>
<p>Some story about winter.</p>
<div class="wrap"><h2>Ingredients</h2></div>
<ul><li>1 whole chicken</li><li>3 carrots, sliced</li><li>2 celery stalks</li></ul>
<h3>For the noodles</h3>
<ul><li>2 cups egg noodles</li></ul>
<h2>Directions</h2>
<p>Put the chicken in a pot and cover with water.</p>
<p>Simmer 2 hours.</p>
<h2>Comments</h2>
<p>Love it!</p>
