name: Bug report
description: Something is broken or behaves unexpectedly.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Security problems go through [SECURITY.md](https://github.com/slukedev/clipcook/blob/main/SECURITY.md), not a public issue.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Include the recipe URL if clipping failed.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Tap ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected
  - type: input
    id: device
    attributes:
      label: Browser and device
      placeholder: Chrome 142 on Pixel 9, Safari on iPad, Echo Show 8
  - type: dropdown
    id: backend
    attributes:
      label: Backend
      options: [Firebase, Local]
  - type: input
    id: version
    attributes:
      label: Commit
      description: The commit your deployment runs, if you know it.
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Remove keys, tokens, emails and other personal data first.
